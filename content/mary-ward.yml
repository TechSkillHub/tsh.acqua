academia: 'A <strong>Oficina Academia Acqua</strong>, atua há mais de 20 anos no mercado fitness, sempre com profissionais qualificados para um melhor atendimento aos nossos clientes.<br/><br/>Nossa estrutura conta com um espaço fitness para aulas de musculação e ginástica, além do espaço aquático com piscina aquecida, para a realização das atividades de natação, hidroginástica e hidroterapia.<br/><br/>Quando você começa a treinar na <strong>Oficina Academia Acqua</strong>, sente um "clima" diferente, graças à atitude de nossos professores e colaboradores, sempre próximos e disponíveis, prontos para ajudá-lo e orientá-lo na busca de seus objetivos. Aqui se treina para viver melhor!'

